# Catálogo de clases de efecto de las tools MCP (SE-508). Lo lee .claude/hooks/lib/mcp_effect_guard.py.
#
# Formato: una línea `nombre_exacto: clase`, sin comodines. Clases:
#   read_only  pasa sin preguntar
#   write      pregunta antes (en un run sin persona se rechaza)
#   merge      se rechaza siempre (los merges van con grant, SE-343)
# Una tool que no está aquí pregunta (falla cerrado).
#
# Editar este fichero en el árbol solo puede endurecerlo: el guard aplica lo más estricto entre
# esta copia y la del `main` remoto. Aflojar una tool exige una PR fusionada.
# Formato estricto: una línea fuera de formato o una clave repetida deja el catálogo ilegible (todo pregunta).

