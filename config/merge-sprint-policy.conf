# SE-433 — política del merge-sprint. La operadora la concede al mergear el PR que la introduce;
# cambiarla exige otro PR mergeado por ella (este fichero es tier 4 en risk-tier.py).
allowed_tiers=1,2,3
ttl_hours=12
max_merges=40
max_prs=50
# Modo cola (merge queue de GitHub) del ejecutor: 0 apagado (por defecto) o 1. MERGE_SPRINT_QUEUE manda sobre
# este valor. Encenderlo solo después de activar la cola en la rama main; si la cola no está activa, el run para.
# Ojo: la variable enciende el modo sin pasar por un PR de esta política ni por el grant (que no firma el modo);
# el run deja mode= en el ledger. Los gates (squash, head revisado, máximo) se exigen igual en los dos modos.
# Condiciones para activar la cola en main: (1) comprobar que una PR con PR Guardian en rojo no puede encolarse
# (en merge_group se saltan los gates 1, 2, 5, 8 y 8b); (2) método Squash; (3) ningún workflow con merge_group
# recibe secretos ni permisos de escritura sin revisión explícita (en la cola corre el código del grupo).
merge_queue=0
