# SE-433 — política del merge-sprint. La operadora la concede al mergear el PR que la introduce;
# cambiarla exige otro PR mergeado por ella (este fichero es tier 4 en risk-tier.py).
allowed_tiers=1,2,3
ttl_hours=12
max_merges=40
max_prs=50
# Modo cola (merge queue de GitHub) del ejecutor: 0 apagado (por defecto) o 1. MERGE_SPRINT_QUEUE manda sobre
# este valor. Encenderlo solo después de activar la cola en la rama main; si la cola no está activa, el run para.
merge_queue=0
