name: CHANGELOG Consolidate

# SE-053 Slice 2 activation (batch 26 / SE-062.4)
# Post-merge to main, consolidate CHANGELOG.d/ fragments into CHANGELOG.md
# when threshold exceeded.
#
# Fix 2026-09-02 (SE-053 errata): push directo a main ya no es posible porque
# main está protegida con branch protection (required status checks). El
# workflow ahora consolida en una rama agent/changelog-consolidate* y abre un
# PR. Auto-merge se habilita si el repo lo permite; si no, el PR queda listo
# para merge manual. Esto respeta la branch protection y la regla
# autonomous-safety (la IA propone, el humano dispone).
#
# Orden de firma (pr-signing-protocol.md): commit del contenido PRIMERO,
# luego confidentiality-sign.sh sign (hash del árbol HEAD), luego commit de la
# firma como último commit de la rama.
#
# Safe: idempotente (bajo threshold = no-op). Solo escribe en la rama agent/*.

on:
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.d/**'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changelog-consolidate
  cancel-in-progress: false

jobs:
  consolidate:
    name: Consolidate CHANGELOG.d if threshold exceeded
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip consolidate]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check threshold
        id: consolidate
        run: |
          set -eo pipefail
          FRAG_COUNT=$(find CHANGELOG.d -maxdepth 1 -type f -name "*.md" ! -name "README.md" | wc -l)
          echo "Fragment count: $FRAG_COUNT"
          echo "fragment_count=$FRAG_COUNT" >> "$GITHUB_OUTPUT"

          if [ "$FRAG_COUNT" -lt 20 ]; then
            echo "Below threshold (20). No consolidation."
            echo "consolidated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "consolidated=true" >> "$GITHUB_OUTPUT"

      - name: Consolidate, sign and open PR
        if: steps.consolidate.outputs.consolidated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          COUNT="${{ steps.consolidate.outputs.fragment_count }}"
          BRANCH="agent/changelog-consolidate"

          # Reuse an existing OPEN consolidation PR if present (no PR spam).
          # Reconstruct the branch from latest main every time (idempotent).
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || true)

          git checkout -B "$BRANCH" origin/main
          echo "Threshold exceeded. Consolidating..."
          bash scripts/changelog-consolidate.sh

          # Commit content first (signature hash is over the committed tree).
          git add CHANGELOG.md CHANGELOG.d/
          git commit -m "chore(changelog): auto-consolidate ${COUNT} fragments [skip consolidate]" \
            -m "Auto-generated by changelog-consolidate workflow. SE-053 Slice 2 activation."

          # Sign as the final commit (see pr-signing-protocol.md).
          bash scripts/confidentiality-sign.sh sign >/dev/null 2>&1 || true
          git add .confidentiality-signature
          git commit -m "chore: sign confidentiality audit [skip consolidate]" 2>/dev/null || true

          if [ -n "$EXISTING_PR" ]; then
            echo "Reusing existing PR #$EXISTING_PR on $BRANCH"
            git push --force-with-lease origin "$BRANCH"
          else
            # SE-390 B: la rama puede quedar stale de un PR previo mergeado/cerrado sin
            # delete (auto-rebase). La rama se recrea siempre desde origin/main, asi que
            # force-with-lease es seguro y protege la carrera con otro run del bot.
            git push --force-with-lease origin "$BRANCH"
            BODY="Auto-generated consolidation of CHANGELOG.d fragments into CHANGELOG.md (SE-053 Slice 2).
            Fragments consolidated: ${COUNT}
            Threshold: 20

            Merge this PR when CI passes to keep CHANGELOG.md up to date."
            gh pr create --base main --head "$BRANCH" \
              --title "chore(changelog): auto-consolidate ${COUNT} fragments [skip consolidate]" \
              --body "$BODY" \
              --label "chore" 2>/dev/null || true
          fi

          # Attempt auto-merge (only merges when required status checks pass).
          if gh pr merge "$BRANCH" --auto --squash 2>/dev/null; then
            echo "Auto-merge enabled for $BRANCH"
          else
            echo "Auto-merge not available — PR left open for manual merge."
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## CHANGELOG Consolidate"
            echo "- Fragment count: ${{ steps.consolidate.outputs.fragment_count }}"
            echo "- Threshold: 20"
            echo "- Consolidated: ${{ steps.consolidate.outputs.consolidated }}"
          } >> "$GITHUB_STEP_SUMMARY"
