name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify dependencies
        run: |
          command -v jq
          command -v python3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install Node.js dependencies
        run: npm install --prefix scripts

      - name: Validate JSON mock files
        run: |
          echo "Validating mock data JSON files..."
          for f in projects/sala-reservas/test-data/*.json; do
            echo "  Checking $f"
            jq empty "$f" || { echo "INVALID JSON: $f"; exit 1; }
          done
          echo "All JSON files are valid."

      - name: Check for sensitive data patterns
        run: |
          echo "Scanning for accidentally committed secrets..."
          # Check for PAT patterns (Azure DevOps PATs: base64 string with = padding, 52 chars typical)
          if grep -rn --include="*.md" --include="*.sh" --include="*.json" --include="*.yml" \
            -E '(^|[^a-zA-Z0-9])[a-zA-Z0-9]{52}[=]*([^a-zA-Z0-9]|$)' \
            --exclude-dir=".git" \
            --exclude-dir="node_modules" \
            . 2>/dev/null | grep -v "mock" | grep -v "example" | grep -v "placeholder" | grep -v "test"; then
            echo "WARNING: Potential secret pattern found. Review the matches above."
          fi
          # Check for AWS access keys
          if grep -rn --include="*.md" --include="*.sh" --include="*.json" --include="*.yml" \
            -E 'AKIA[0-9A-Z]{16}' \
            --exclude-dir=".git" \
            . 2>/dev/null; then
            echo "WARNING: Potential AWS credential found. Review the matches above."
          fi
          # Check for GitHub personal access tokens
          if grep -rn --include="*.md" --include="*.sh" --include="*.json" --include="*.yml" \
            -E '(ghp_|github_pat_)[A-Za-z0-9_]{36,}' \
            --exclude-dir=".git" \
            . 2>/dev/null; then
            echo "WARNING: Potential GitHub token found. Review the matches above."
          fi
          # Check for real org URL patterns (not placeholders)
          if grep -rn --include="*.md" --include="*.sh" \
            "dev.azure.com" . \
            --exclude-dir=".git" \
            | grep -v "TU-ORGANIZACION" \
            | grep -v "miempresa" \
            | grep -v "YOUR-ORG" \
            | grep -v "example" \
            | grep -v "SETUP.md" \
            | grep -v "README.md" \
            | grep -v "CHANGELOG.md" \
            | grep -v "CONTRIBUTING.md"; then
            echo "WARNING: Real Azure DevOps org URL may be present. Review the matches above."
          fi
          echo "Secret scan complete."

      - name: "Gate: PR created via /pr-plan (Rule #25)"
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking that PR was created via /pr-plan..."
          PR_NUM="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          # Use REST API with pagination (gh pr diff fails with HTTP 406 on PRs >300 files)
          FILES=$(gh api "repos/$REPO/pulls/$PR_NUM/files?per_page=100" --paginate --jq '.[].filename' 2>/dev/null || echo "")
          if echo "$FILES" | grep -qx '.confidentiality-signature'; then
            echo "PASS: PR includes confidentiality signature (pr-plan was run)."
          else
            echo "FAIL: .confidentiality-signature not in PR files."
            echo "Run /pr-plan before creating the PR."
            exit 1
          fi

      - name: "SE-253: Changelog spec-field check (warn -- promoted to block after Sprint 30)"
        run: bash scripts/changelog-spec-field-check.sh --warn
        continue-on-error: true

      - name: "SE-253 errata: Validate opencode.json schema keys"
        run: bash scripts/opencode-config-validate.sh --check

      - name: "SE-257: Memory liveness check"
        run: bash scripts/memory-liveness-check.sh
        continue-on-error: true

      - name: Run workspace test suite (mock mode)
        run: |
          chmod +x scripts/test-workspace.sh
          ./scripts/test-workspace.sh --mock
        continue-on-error: false

      - name: Verify required open source files exist
        run: |
          echo "Checking required open source files..."
          required_files=(
            "LICENSE"
            "README.md"
            "CHANGELOG.md"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            "SECURITY.md"
            "docs/ROADMAP.md"
            ".github/pull_request_template.md"
            ".github/ISSUE_TEMPLATE/bug_report.yml"
            ".github/ISSUE_TEMPLATE/feature_request.yml"
          )
          all_ok=true
          for f in "${required_files[@]}"; do
            if [ -f "$f" ]; then
              echo "  ✅ $f"
            else
              echo "  ❌ MISSING: $f"
              all_ok=false
            fi
          done
          if [ "$all_ok" = false ]; then
            echo "One or more required files are missing."
            exit 1
          fi
          echo "All required files present."

  eval-lint:
    name: Eval Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify dependencies
        run: |
          command -v jq
          command -v python3

      - name: Run eval-lint (SE-316 golden sets)
        run: |
          bash scripts/eval-lint.sh --check tests/evals || {
            echo "::error::Golden sets de tribunales con violaciones (SE-316). Revisar tests/evals/*/cases.jsonl"
            exit 1
          }

  scope-creep:
    name: Scope Creep (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true  # SE-315 S3: report-only hasta calibración (AC-S3.2)

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Run scope-creep-check (SE-315)
        run: |
          # Detecta la spec del PR y compara el diff base..head contra su alcance.
          SID=$(git log origin/${{ github.event.pull_request.base.ref }}..HEAD --format=%B 2>/dev/null \
            | grep -oE '\b(SE|SPEC)-[0-9]+\b' | head -1 || true)
          if [[ -z "$SID" ]]; then
            echo "::notice::Scope Creep: sin ref de spec en commits (se omite)"
            exit 0
          fi
          SPEC=$(find docs/propuestas -maxdepth 1 -type f -name "${SID}*.md" 2>/dev/null | head -1)
          [[ -z "$SPEC" ]] && SPEC=$(find projects -maxdepth 3 -type f -name "${SID}*.spec.md" 2>/dev/null | head -1)
          if [[ -z "$SPEC" ]]; then
            echo "::notice::Scope Creep: spec ${SID} no encontrada (se omite)"
            exit 0
          fi
          bash scripts/scope-creep-check.sh --spec "$SPEC" \
            --base "origin/${{ github.event.pull_request.base.ref }}" --head HEAD --json
          VERDICT=$(bash scripts/scope-creep-check.sh --spec "$SPEC" \
            --base "origin/${{ github.event.pull_request.base.ref }}" --head HEAD --verdict)
          echo "::notice::Scope Creep veredicto: ${VERDICT}"

  incident-rca-eval:
    name: Incident RCA Eval (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true  # SE-323 S3: report-only; gate de calidad, no de seguridad

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run RCA synthetic suite (SE-323 S3)
        run: |
          bash scripts/rca-eval-runner.sh --json
          SCORE=$(bash scripts/rca-eval-runner.sh --json | python3 -c "import sys,json;print(json.load(sys.stdin)['score'])")
          echo "::notice::Incident RCA eval score: ${SCORE}/100 (gate >= 80)"

  blast-radius:
    name: Blast-radius (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true  # SE-318 S3: report-only; aviso, nunca gate

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Run blast-radius on PR diff (SE-318 S2)
        run: |
          TOTAL=$(bash scripts/blast-radius.sh --diff \
            "origin/${{ github.event.pull_request.base.ref }}..HEAD" 2>/dev/null \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['total'])" 2>/dev/null || echo "0")
          echo "::notice::Blast-radius: ${TOTAL} fichero(s) dependientes tocados por el diff (umbral 10)"
          if [[ "${TOTAL}" -gt 10 ]]; then
            echo "::warning::Blast-radius ${TOTAL} > 10 — revisar impacto antes del merge (SE-318)"
          fi

  vault-graph:
    name: Vault Graph (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true  # SE-325 S4: gate de calidad, no de seguridad

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run vault-links extract+validate (SE-325)
        run: |
          # vaults/ es local (gitignored); en CI se usa un vault de fixture mínimo
          if [[ ! -d vaults/ci-fixture ]]; then
            mkdir -p vaults/ci-fixture/docs
            printf '%s\n' '---' 'entity: {type: document, id: ci-fixture}' 'title: CI Fixture' 'status: approved' '---' '# Fixture' 'Ver [[ci-other]]' > vaults/ci-fixture/docs/ci.md
            printf '%s\n' '---' 'entity: {type: document, id: ci-other}' 'title: CI Other' 'status: draft' '---' '# Other' > vaults/ci-fixture/docs/other.md
          fi
          bash scripts/vault-links.sh extract vaults/ci-fixture > /tmp/vault-links.jsonl
          NEDGES=$(wc -l < /tmp/vault-links.jsonl)
          echo "::notice::Vault graph: ${NEDGES} aristas extraídas (SE-325)"
          bash scripts/vault-links.sh validate /tmp/vault-links.jsonl || true

  bats-tests:
    timeout-minutes: 90
    name: BATS Hook Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install BATS and dependencies
        run: |
          git clone --depth 1 --branch v1.9.0 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local
          command -v jq
          command -v git
          command -v bash
          command -v pip3
          pip3 install pytest
          npm install --prefix scripts
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Runner"

      - name: Run dual-cli contract tests
        run: python3 -m unittest discover -s tests/dual-cli -v

      - name: Generate BATS dependency map
        id: deps
        run: bash scripts/ci-bats-deps.sh --generate

      - name: Select BATS tests based on changes
        id: select
        env:
          SAVIA_BATS_FULL_THRESHOLD_PCT: 50
        run: |
          if bash scripts/ci-select-bats.sh --base "origin/${{ github.base_ref }}" 2>/dev/null; then
            SELECTED="$(bash scripts/ci-select-bats.sh --base "origin/${{ github.base_ref }}" 2>/dev/null)"
          else
            SELECTED="FULL"
          fi
          echo "tests=$SELECTED" >> "$GITHUB_OUTPUT"

      - name: "Run selected BATS tests (dynamic)"
        if: steps.select.outputs.tests != 'FULL'
        run: |
          for test in ${{ steps.select.outputs.tests }}; do
            bats "tests/bats/$test" || { echo "FAIL: $test"; exit 1; }
          done

      - name: "Run full BATS test suite (fallback)"
        if: steps.select.outputs.tests == 'FULL'
        run: bash tests/run-all.sh

      - name: Run test quality audit
        run: bash scripts/audit-test-quality.sh --summary

      - name: "Gate: Test Quality (SPEC-055 — all tests >= 80)"
        env:
          # SPEC-200 telemetry pilot (30d): compute adaptive threshold and
          # emit advisory to stderr, but still gate on fixed_min=80.
          # Promote to 'on' once output/quality-gate-history.jsonl shows
          # the adaptive threshold tracks the score distribution well.
          SAVIA_QUALITY_GATE_ADAPTIVE: warn
        run: bash scripts/ci-test-quality-gate.sh

      - name: "Upload SPEC-200 telemetry (quality-gate-history.jsonl)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-200-telemetry-${{ github.run_number }}
          path: output/quality-gate-history.jsonl
          if-no-files-found: ignore
          retention-days: 30

      - name: Run coverage report
        run: bash scripts/coverage-report.sh --ci

      - name: Run security scan
        run: bash scripts/security-scan.sh --ci

      - name: Run vulnerability scan
        run: bash scripts/vuln-scan.sh --ci

      - name: Run extended CI checks
        run: bash scripts/ci-extended-checks.sh

  lint-markdown:
    timeout-minutes: 15
    name: Lint Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Lint Markdown (native — no npm dependency)
        run: |
          python3 -m scripts.markdownlint \
            --config .markdownlint.json \
            CHANGELOG.md README.md README.en.md || true
        # 'true' keeps CI green while the team establishes linting baseline.
        # Expand file list as files are fixed. Remove '|| true' when all pass.

      - name: Validate file sizes (≤150 lines)
        run: |
          echo "Validating file sizes..."
          FAILED=0
          # Check skills
          for file in .opencode/skills/*/SKILL.md; do
            if [ -f "$file" ]; then
              lines=$(wc -l < "$file")
              if [ "$lines" -gt 150 ]; then
                echo "❌ FAIL: $file ($lines líneas)"
                FAILED=$((FAILED + 1))
              fi
            fi
          done
          # Check agents
          for file in .opencode/agents/*.md; do
            if [ -f "$file" ]; then
              lines=$(wc -l < "$file")
              if [ "$lines" -gt 150 ]; then
                echo "❌ FAIL: $file ($lines líneas)"
                FAILED=$((FAILED + 1))
              fi
            fi
          done
          # Check domain rules
          for file in .claude/rules/domain/*.md; do
            if [ -f "$file" ]; then
              lines=$(wc -l < "$file")
              if [ "$lines" -gt 150 ]; then
                echo "⚠️  WARNING: $file ($lines líneas)"
              fi
            fi
          done
          # Check commands
          for file in .opencode/commands/*.md; do
            if [ -f "$file" ]; then
              lines=$(wc -l < "$file")
              if [ "$lines" -gt 150 ]; then
                echo "❌ FAIL: $file ($lines líneas)"
                FAILED=$((FAILED + 1))
              fi
            fi
          done
          if [ $FAILED -gt 0 ]; then
            echo "$FAILED ficheros exceden 150 líneas."
            exit 1
          fi
          echo "✅ All files within 150 lines limit."

      - name: Validate settings.json JSON schema
        run: |
          echo "Validating .claude/settings.json..."
          python3 -c "import json; json.load(open('.claude/settings.json'))" && \
            echo "✅ settings.json is valid JSON" || \
            { echo "❌ settings.json is invalid JSON"; exit 1; }

      - name: Validate command frontmatter
        run: |
          echo "Validating command frontmatter..."
          FAILED=0
          WARNED=0
          for file in .opencode/commands/*.md; do
            if [ -f "$file" ]; then
              if head -1 "$file" | grep -q "^---$"; then
                # Has frontmatter → validate required fields
                if ! grep -q "^name:" "$file"; then
                  echo "❌ FAIL: $file missing 'name' field"
                  FAILED=$((FAILED + 1))
                fi
                if ! grep -q "^description:" "$file"; then
                  echo "❌ FAIL: $file missing 'description' field"
                  FAILED=$((FAILED + 1))
                fi
              else
                # Legacy command without frontmatter → warning only
                echo "⚠️  WARNING: $file has no frontmatter (legacy)"
                WARNED=$((WARNED + 1))
              fi
            fi
          done
          if [ $FAILED -gt 0 ]; then
            echo "$FAILED command(s) have invalid frontmatter."
            exit 1
          fi
          echo "✅ Frontmatter valid ($WARNED legacy commands without frontmatter)."

  skill-agent-plugins-gate:
    timeout-minutes: 10
    name: Agent Plugins Compliance (SE-333)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify jq
        run: command -v jq

      - name: Run skill-audit --agent-plugins --strict
        run: |
          bash scripts/skill-audit.sh --agent-plugins --strict --json || {
            echo "::error::Skills no conformes con agent-plugins.org/agentskills.io (SE-333). Ejecutar: bash scripts/skill-audit.sh --agent-plugins --json"
            exit 1
          }

      - name: Verify plugin.json + mcp.json validity
        run: |
          jq -e . plugin.json >/dev/null || { echo "::error::plugin.json inválido"; exit 1; }
          jq -e . mcp.json >/dev/null || { echo "::error::mcp.json inválido"; exit 1; }
          echo "Agent Plugins manifests válidos"

  hook-perf-gate:
    timeout-minutes: 10
    name: Hook Latency Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify dependencies
        run: |
          command -v jq
          command -v python3

      - name: Run hook latency benchmark (strict — fail if any hook > 200ms)
        run: bash scripts/hook-latency-bench.sh --iterations 3 --threshold 200 --strict

  agent-sync-check:
    timeout-minutes: 5
    name: Agent Sync Check
    runs-on: ubuntu-latest
    if: |
      contains(toJson(github.event.commits.*.modified), '.claude/agents') ||
      contains(toJson(github.event.commits.*.modified), '.opencode/agents') ||
      github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify dependencies
        run: command -v python3

      - name: SE-253 Agent sync guard — verify .claude/agents ↔ .opencode/agents
        run: bash scripts/agents-catalog-sync.sh --check

  standards-compliance:
    runs-on: ubuntu-latest
    name: Standards Compliance Gate
    continue-on-error: true  # SE-311: se vuelve blocking cuando main este limpio (#949)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Fetch main (PR diff para confid/scan)
        run: git fetch --depth=1 origin main
      - name: Verify dependencies
        run: command -v python3
      - name: SE-311 Standards Compliance Gate (determinista, diff final)
        run: bash scripts/standards-compliance-gate.sh --json

  dependency-audit:
    runs-on: ubuntu-latest
    name: Dependency Audit (SE-258 Slice 5)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: npm audit (workspace scripts)
        run: |
          npm install --prefix scripts --package-lock-only >/dev/null 2>&1 || true
          npm audit --prefix scripts --audit-level=high || true
      - name: Python deps check (venv)
        run: |
          command -v python3
          python3 -m pip list --outdated 2>/dev/null | head -20 || true
