name: Confidentiality Gate

on:
  pull_request:
    branches: [main]
  schedule:
    # Full repo audit every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan mode'
        required: false
        default: 'full-repo'
        type: choice
        options:
          - full-repo
          - pr

permissions:
  contents: read

jobs:
  # SE-501: escaneo obligatorio y bloqueante del diff de la PR con el escáner de la BASE (extraído a un
  # directorio aparte por confidentiality-pr-scan.sh). Solo gate-result «clean» da PASS. Sin secretos:
  # ningún job de PR recibe CONFIDENTIALITY_HMAC_KEY (I3). Este nombre es el contexto requerido de main.
  confidentiality-scan-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Confidentiality scan (PR)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags origin "$BASE_SHA" +refs/heads/main:refs/remotes/origin/main

      - name: Scan PR diff with the base scanner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # El envoltorio también sale de la base. Solo la PR que lo introduce (SE-501) se escanea con el
        # suyo, porque la base aún no lo tiene; desde su merge, nunca.
        run: |
          if git cat-file -e "$BASE_SHA:scripts/confidentiality-pr-scan.sh" 2>/dev/null; then
            git show "$BASE_SHA:scripts/confidentiality-pr-scan.sh" > "$RUNNER_TEMP/pr-scan.sh"
          else
            echo "::warning::la base no tiene confidentiality-pr-scan.sh (PR de arranque SE-501); se usa el de la PR"
            cp scripts/confidentiality-pr-scan.sh "$RUNNER_TEMP/pr-scan.sh"
          fi
          bash "$RUNNER_TEMP/pr-scan.sh" --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA"

  confidentiality-scan-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Full Repo Confidentiality Audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate dynamic blocklist
        run: bash scripts/generate-blocklist.sh > /tmp/dynamic-blocklist.txt

      - name: Run full repo confidentiality scan
        run: bash scripts/confidentiality-scan.sh --full-repo --blocklist /tmp/dynamic-blocklist.txt
