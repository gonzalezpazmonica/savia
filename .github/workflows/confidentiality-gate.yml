name: Confidentiality Gate

on:
  pull_request:
    branches: [main]
  schedule:
    # Full repo audit every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan mode'
        required: false
        default: 'full-repo'
        type: choice
        options:
          - full-repo
          - pr

permissions:
  contents: read

jobs:
  signature-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Verify Audit Signature
    env:
      # SE-426: firma y verificación con la clave real (secreto de CI); sin clave, falla cerrado.
      CONFIDENTIALITY_HMAC_KEY: ${{ secrets.CONFIDENTIALITY_HMAC_KEY }}
      CONFIDENTIALITY_REQUIRE_HMAC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base
        run: git fetch origin ${{ github.base_ref }}

      - name: Verify confidentiality signature
        run: bash scripts/confidentiality-sign.sh verify

  confidentiality-scan-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: PII & Confidentiality Scan (PR)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate dynamic blocklist
        run: bash scripts/generate-blocklist.sh > /tmp/dynamic-blocklist.txt

      - name: Run confidentiality scanner on PR diff
        run: bash scripts/confidentiality-scan.sh --pr --blocklist /tmp/dynamic-blocklist.txt

  confidentiality-scan-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Full Repo Confidentiality Audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate dynamic blocklist
        run: bash scripts/generate-blocklist.sh > /tmp/dynamic-blocklist.txt

      - name: Run full repo confidentiality scan
        run: bash scripts/confidentiality-scan.sh --full-repo --blocklist /tmp/dynamic-blocklist.txt
