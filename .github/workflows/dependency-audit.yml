name: Dependency Audit

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

concurrency:
  group: dependency-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Run npm audit
        run: |
          if [ -f .opencode/package.json ]; then
            cd .opencode && npm audit --production || true
          else
            echo "No .opencode/package.json found, skipping"
          fi
        continue-on-error: true

  pip-audit:
    name: pip audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: |
          pip install --require-hashes --only-binary=:all: -r .github/requirements/pip-audit.lock.txt

      - name: Find and audit requirements
        run: |
          found=0
          for req in requirements.txt scripts/requirements.txt; do
            if [ -f "$req" ]; then
              echo "Auditing $req"
              pip-audit -r "$req" || true
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No requirements files found, skipping pip audit"
          fi
        continue-on-error: true
