name: Savia E2E Test

on:
  push:
    paths:
      - 'docker/savia-test/**'
      - '.opencode/commands/flow-*.md'
      - '.opencode/skills/savia-flow-practice/**'
  pull_request:
    paths:
      - 'docker/savia-test/**'
      - '.opencode/commands/flow-*.md'
      - '.opencode/skills/savia-flow-practice/**'

permissions:
  contents: read

jobs:
  e2e-mock:
    name: Savia E2E Mock Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run structure tests
        run: bash scripts/test-savia-e2e-harness.sh

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: savia-e2e-metrics
          path: docker/savia-test/output/
          retention-days: 30
