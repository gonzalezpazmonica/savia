<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Space — entrar con ChatGPT (prototipo)</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#6b6b6b;--line:#e8e8e6;--bubble:#f1f1ef;--panel:#f9f9f8;--btn:#1a1a1a;--btn-fg:#fff;--ok:#1f7a4d;--warn:#9a6700;--bad:#b42318;--term:#f4f4f2;
--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#212121;--fg:#ececec;--muted:#a3a3a3;--line:#363636;--bubble:#303030;--panel:#181818;--btn:#ececec;--btn-fg:#1a1a1a;--ok:#4cc38a;--warn:#e3b341;--bad:#f97066;--term:#161616;color-scheme:dark}}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--font);margin:0}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.banner{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;font-size:13px;color:var(--muted)}
.banner b{color:var(--warn)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
.tabs button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
main{padding:12px 16px 40px;flex:1}
h2{font-size:14px;font-weight:600;color:var(--muted);margin:4px 0 12px}
.user{display:flex;justify-content:flex-end;margin:14px 0}
.user p{background:var(--bubble);border-radius:20px;padding:10px 16px;margin:0;max-width:85%}
.bot p{margin:0 0 10px}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:17px;line-height:1.3}
.status{font-size:15px;margin:0 0 4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
.code{font:600 28px/1.2 var(--mono);letter-spacing:.12em;margin:10px 0;text-align:center}
.addr{font:15px var(--mono);word-break:break-all;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.b{border-radius:999px;padding:10px 16px;font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.b.primary{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.b.danger{color:var(--bad);border-color:var(--bad)}
.done{color:var(--ok);font-size:14px;margin-top:10px}
.small{font-size:13px;color:var(--muted)}
pre{background:var(--term);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:13px/1.45 var(--mono);white-space:pre-wrap;margin:6px 0 14px}
</style></head><body>
<div class="app">
<div class="banner"><b>Prototipo.</b> El código, las horas y el tipo de cuenta son un ejemplo inventado. Nada está conectado a ChatGPT ni a tu ordenador. Los botones solo enseñan qué pasaría.</div>
<div class="tabs" role="tablist" id="tabs"></div>
<main id="main"></main>
</div>
<script>
const $=s=>document.querySelector(s);
const states={
none:{t:"1 · Sin sesión",h:`
<h2>Ajustes › Motor</h2>
<div class="card" id="c-none"><p class="status"><span class="dot"></span><b>ChatGPT</b> · sin sesión</p>
<p class="small">Space piensa con tu suscripción de ChatGPT. Para eso tienes que entrar una vez con tu cuenta. No hace falta copiar ninguna clave.</p>
<div class="row"><button class="b primary" data-go="code">Entrar con ChatGPT</button></div></div>
<h2>Si le pides algo a Savia sin haber entrado</h2>
<div class="user"><p>Resume el informe de ayer</p></div>
<div class="bot"><p>No puedo pensar ahora: no hay sesión de ChatGPT en Space. Tu petición queda en espera.</p>
<p>No he usado otro servicio en su lugar. Entra con ChatGPT en Ajustes › Motor y la retomo.</p></div>`},
code:{t:"2 · Código",h:`
<h2>Ajustes › Motor › Entrar con ChatGPT</h2>
<div class="card" id="c-code"><h3>Termina de entrar desde el móvil o desde otro ordenador</h3>
<p>1. Abre esta dirección:</p>
<div class="addr">auth.openai.com/codex/device</div>
<p>2. Escribe este código:</p>
<div class="code" aria-label="Código de ejemplo">KQMW-TXRB</div>
<p>3. Acepta con tu cuenta de ChatGPT.</p>
<p class="small"><span class="dot warn"></span>Esperando a que aceptes. Esta pantalla cambia sola. El código caduca en 15 minutos; si caduca, te doy otro.</p>
<div class="row"><button class="b primary" data-go="ok">Simular: ya he aceptado</button><button class="b" data-a="code" data-msg="Cancelado. No se ha guardado nada y sigues sin sesión.">Cancelar</button></div></div>
<p class="small">Nunca te pediré tu contraseña de ChatGPT aquí: la escribes solo en la página de OpenAI.</p>`},
ok:{t:"3 · Sesión activa",h:`
<h2>Ajustes › Motor</h2>
<div class="card" id="c-ok"><p class="status"><span class="dot ok"></span><b>ChatGPT</b> · sesión activa</p>
<p>Cuenta: ChatGPT Plus (ejemplo).</p>
<p>El acceso caduca hoy a las 17:40 y se renueva solo. No tienes que hacer nada.</p>
<p class="small">La sesión se guarda solo dentro de Space, en este ordenador. Savia y sus herramientas no pueden leerla.</p>
<div class="row"><button class="b danger" data-go="logout">Cerrar sesión</button></div></div>
<h2>Y en el chat, todo sigue igual</h2>
<div class="user"><p>Resume el informe de ayer</p></div>
<div class="bot"><p>El informe de ayer (ejemplo) recoge tres avances y un bloqueo…</p>
<p class="small">Esta respuesta ha usado tu suscripción de ChatGPT, no saldo de pago por uso.</p></div>`},
expired:{t:"4 · Caducada",h:`
<h2>Una semana después</h2>
<p class="small">Normalmente no te enteras: el acceso caduca y Space lo renueva solo. Esto es lo que ves si OpenAI rechaza la renovación.</p>
<div class="user"><p>Resume el informe de ayer</p></div>
<div class="bot"><p>La sesión de ChatGPT ha caducado. Vuelve a entrar.</p>
<p>Tu petición queda en espera y la retomo en cuanto entres. No he usado otro servicio en su lugar.</p></div>
<div class="card" id="c-exp"><p class="status"><span class="dot bad"></span><b>ChatGPT</b> · caducada</p>
<p class="small">OpenAI no aceptó renovar el acceso. Puede pasar si cambiaste la contraseña, cerraste las sesiones desde ChatGPT o tu suscripción terminó.</p>
<div class="row"><button class="b primary" data-go="code">Volver a entrar</button></div></div>`},
logout:{t:"5 · Cerrar sesión",h:`
<h2>Ajustes › Motor › Cerrar sesión</h2>
<div class="card" id="c-out"><h3>¿Cerrar la sesión de ChatGPT?</h3>
<p>Se borra de este ordenador. Hasta que vuelvas a entrar, Savia no podrá pensar en Space y te lo dirá cuando le pidas algo.</p>
<p class="small">Space no cambiará a otro servicio por su cuenta.</p>
<div class="row"><button class="b danger" data-a="out" data-msg="Sesión cerrada y borrada de este ordenador. Ajustes › Motor vuelve a decir «ChatGPT · sin sesión».">Sí, cerrar sesión</button><button class="b" data-a="out" data-msg="No se ha borrado nada. La sesión sigue activa.">Cancelar</button></div></div>`},
doctor:{t:"6 · Terminal",h:`
<h2>Lo mismo desde la terminal</h2>
<p class="small">Para quien prefiera escribir órdenes. Nada de esto es necesario si usas la app.</p>
<p><b>Entrar</b></p>
<pre>$ savia-space login chatgpt
Abre esta dirección en cualquier dispositivo:
  https://auth.openai.com/codex/device
Escribe este código: KQMW-TXRB
Esperando a que aceptes (el código caduca en 15 minutos)…
Listo: sesión de ChatGPT activa.</pre>
<p><b>Comprobar el estado, con sesión</b></p>
<pre>$ savia-space doctor
ChatGPT: sesión activa · el acceso caduca a las 17:40 · se renueva solo
Salida a internet del motor: sin restringir todavía</pre>
<p><b>Comprobar el estado, sin sesión</b></p>
<pre>$ savia-space doctor
ChatGPT: sin sesión
  Space está configurado para pensar con ChatGPT y no puede.
  Para entrar: savia-space login chatgpt
(termina con error)</pre>
<p><b>Comprobar el estado, caducada</b></p>
<pre>$ savia-space doctor
ChatGPT: caducada · OpenAI no aceptó renovar el acceso
  Para entrar: savia-space login chatgpt
(termina con error)</pre>
<p><b>Cerrar sesión</b></p>
<pre>$ savia-space logout chatgpt
Sesión de ChatGPT cerrada y borrada de este ordenador.</pre>
<p class="small">Ninguna de estas órdenes enseña tu clave de acceso, ni entera ni un trozo.</p>`}
};
const order=["none","code","ok","expired","logout","doctor"];
const tabs=$("#tabs"),main=$("#main");
function answer(b){
 const c=b.closest(".card"),d=document.createElement("div");
 d.className="done";d.textContent=b.dataset.msg;
 c.querySelector(".row").remove();c.appendChild(d);
}
function show(k){
 if(!states[k])k="none";
 [...tabs.children].forEach(b=>b.setAttribute("aria-selected",b.dataset.k===k));
 main.innerHTML=states[k].h;
 main.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>answer(b));
 main.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));
 try{const u=new URL(location.href);u.searchParams.set("s",k);history.replaceState(null,"",u)}catch(e){}
}
order.forEach(k=>{const b=document.createElement("button");b.textContent=states[k].t;b.dataset.k=k;b.setAttribute("role","tab");b.onclick=()=>show(k);tabs.appendChild(b)});
show(new URLSearchParams(location.search).get("s")||"none");
</script></body></html>
